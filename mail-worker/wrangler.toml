name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[routes]]
pattern = "mail.ziyoly.com"
custom_domain = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "f8def8e9-acfc-4bde-a25f-24e025213010"

[[kv_namespaces]]
binding = "kv"
id = "8c000e9e8fba4b19a3d513e89d8cb0a4"

[[r2_buckets]]
binding = "r2"
bucket_name = "cloud-mail-attachments"

[[send_email]]
name = "email"

[ai]
binding = "ai"

[assets]
binding = "assets"		#Static asset binding name; do not change the default
directory = "./dist"	#Directory for built Vue frontend assets; defaults to dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#Run hourly; resetDaySendCount takes effect only at 00:00 UTC


[vars]
#ai_model = ""			#AI model; defaults to @cf/meta/llama-3.1-8b-instruct-fast when empty
#analysis_cache = false			#Whether to enable analytics data caching
#orm_log = false			#Whether to log SQL
domain = ["ziyoly.com"]
admin = "admin@ziyoly.com"
#jwt_secret = ""			#JWT secret; enter any string

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
