name = "test-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"			#D1 database binding name; do not change the default
database_name = "test-email"		#D1 database name
database_id = "e65f099d-796d-4eaa-8dff-529b368b20db"		#D1 database ID

[[kv_namespaces]]
binding = "kv"			#KV binding name; do not change the default
id = "9be10cd058e04c55b526f8c0c116f50c"					#KV database ID

#(optional)
#[[r2_buckets]]
#binding = "r2"			#R2 storage binding name; do not change the default
#bucket_name = "test-email"		#R2 bucket name

[ai]
binding = "ai"

[assets]
binding = "assets"		#Static asset binding name; do not change the default
directory = "./dist"	#Directory for built Vue frontend assets; defaults to dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#Run hourly; resetDaySendCount takes effect only at 00:00 UTC


[vars]
ai_model = ""			#AI model; defaults to @cf/meta/llama-3.1-8b-instruct-fast when empty
analysis_cache = false			#Whether to enable analytics data caching
orm_log = false			#Whether to log SQL
domain = ["example.com"]				#Multiple mail domains can be configured; example: ["example1.com","example2.com"]
admin = "admin@example.com"				#Administrator email; example: admin@example.com
jwt_secret = "b7f29a1d-18e2-4d3b-941f-f6b2c97c02fd"			#JWT secret; enter any string

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
